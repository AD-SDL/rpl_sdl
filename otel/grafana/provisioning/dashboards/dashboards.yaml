# Grafana Dashboard Provisioning for RPL SDL
#
# Auto-loads dashboards from the json/ directory on startup.

apiVersion: 1

providers:
  - name: 'MADSci Dashboards'
    orgId: 1
    folder: 'MADSci'
    folderUid: 'madsci'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
