location_manager_name: RPL SDL Location Manager
location_manager_description: The main location manager for the RPL SDL and Autobots Workcell

# Lab-managed locations moved to locations.yaml (v0.8.0 LabLocationConfig format,
# auto-discovered via walk-up). Hardware retraining is planned post-migration.

# Transfer capabilities configuration (prefixed alias still resolves to transfer_capabilities in v0.8.0)
location_transfer_capabilities:
  transfer_templates: []
  override_transfer_templates:
    pair_overrides:
      ot2_gamma.deck_2:
        camera_station:
          - node_name: pf400
            action: transfer
            source_argument_name: source
            target_argument_name: target
            cost_weight: 1.0
            additional_args:
              source_plate_rotation: "wide"
              target_plate_rotation: "narrow"
              grab_offset: 1.0
            additional_location_args:
              rotation_deck: pf400.rotation_deck
              source_approach: ot2_gamma.safe_approach
              target_approach: camera_station_approach
      camera_station:
        ot2_gamma.deck_2:
          - node_name: pf400
            action: transfer
            source_argument_name: source
            target_argument_name: target
            cost_weight: 1.0
            additional_args:
              source_plate_rotation: "narrow"
              target_plate_rotation: "wide"
            additional_location_args:
              rotation_deck: pf400.rotation_deck
              source_approach: camera_station_approach
              target_approach: ot2_gamma.safe_approach
        ot2_beta.deck_2:
          - node_name: pf400
            action: transfer
            source_argument_name: source
            target_argument_name: target
            cost_weight: 1.0
            additional_args:
              source_plate_rotation: "narrow"
              target_plate_rotation: "wide"
            additional_location_args:
              rotation_deck: pf400.rotation_deck
              source_approach: camera_station_approach
      ot2_beta.deck_2:
        camera_station:
          - node_name: pf400
            action: transfer
            source_argument_name: source
            target_argument_name: target
            cost_weight: 1.0
            additional_args:
              source_plate_rotation: "wide"
              target_plate_rotation: "narrow"
            additional_location_args:
              rotation_deck: pf400.rotation_deck
              target_approach: camera_station_approach
