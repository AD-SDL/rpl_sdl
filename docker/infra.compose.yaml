# RPL SDL infrastructure services (FOSS stack, post-v0.8.0 migration).
# Provides FerretDB (MongoDB-compatible), Valkey (Redis-compatible), and split PostgreSQL.
# SeaweedFS (S3-compatible) is omitted — current SDL does not use object storage.

services:
  rpl_ferretdb:
    container_name: rpl_ferretdb
    image: ghcr.io/ferretdb/ferretdb:2
    profiles:
      - infra
      - managers
      - ''
    ports:
      - 27017:27017
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://madsci:madsci@rpl_ferretdb_postgres:5432/postgres
    depends_on:
      - rpl_ferretdb_postgres
    restart: unless-stopped

  rpl_valkey:
    container_name: rpl_valkey
    image: valkey/valkey:8
    profiles:
      - infra
      - managers
      - ''
    ports:
      - 6379:6379
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-../}.madsci/valkey:/data
    command: valkey-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000
    restart: unless-stopped

  # PostgreSQL with DocumentDB extension — used exclusively by FerretDB.
  rpl_ferretdb_postgres:
    container_name: rpl_ferretdb_postgres
    image: ghcr.io/ferretdb/postgres-documentdb-dev:17-ferretdb
    profiles:
      - infra
      - managers
      - ''
    environment:
      - POSTGRES_USER=madsci
      - POSTGRES_PASSWORD=madsci
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-../}.madsci/postgresql/data:/var/lib/postgresql/data
    restart: unless-stopped

  # Standard PostgreSQL — used by the Resource Manager for relational data.
  rpl_postgres_resources:
    container_name: rpl_postgres_resources
    image: postgres:17
    profiles:
      - infra
      - managers
      - ''
    environment:
      - POSTGRES_USER=madsci
      - POSTGRES_PASSWORD=madsci
      - POSTGRES_DB=resources
    ports:
      - 5434:5432
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-../}.madsci/postgresql_resources/data:/var/lib/postgresql/data
    restart: unless-stopped

  rpl_pgadmin:
    container_name: rpl_pgadmin
    image: dpage/pgadmin4
    profiles:
      - pgadmin
    user: root
    environment:
      - PGADMIN_DEFAULT_EMAIL=rpl@rpl.com
      - PGADMIN_DEFAULT_PASSWORD=rpl
    ports:
      - 5050:80
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-../}.madsci/pgadmin:/var/lib/pgadmin
    depends_on:
      - rpl_postgres_resources
      - rpl_ferretdb_postgres

  rpl_uptime:
    image: louislam/uptime-kuma
    container_name: rpl_uptime
    profiles:
      - infra
      - ''
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-../}.madsci/uptime:/app/data
    ports:
      - 9991:3001
    restart: unless-stopped
